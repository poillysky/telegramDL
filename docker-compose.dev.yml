# 开发用：挂载源码 + --reload
# 启动: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  web:
    volumes:
      - ./app:/app/app
      - ./downloads:/app/downloads
      - ./data:/app/data
      - ./sessions:/app/sessions
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "9345",
        "--reload",
        "--reload-dir",
        "/app/app",
      ]
