name: Docker Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: poillysky/telegramdl

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker Hub token
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD || vars.DOCKERHUB_TOKEN || vars.DOCKERHUB_PASSWORD }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::读不到 Docker Hub Token（secrets/vars 都为空）。"
            echo "打开：https://github.com/poillysky/telegramDL/settings/secrets/actions"
            echo "点 New repository secret："
            echo "  Name  = DOCKERHUB_TOKEN"
            echo "  Secret = Docker Hub 的 Access Token（不是登录密码）"
            echo "创建 Token：https://hub.docker.com/settings/security"
            echo "注意：要加在 Secrets 页，不是 Variables 页；加完后用 Run workflow 新建一次，不要 Re-run 旧任务。"
            exit 1
          fi
          echo "Token detected (length=${#TOKEN})"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || 'poillysky' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD || vars.DOCKERHUB_TOKEN || vars.DOCKERHUB_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
