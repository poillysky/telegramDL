name: Docker Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签（如 1.0.16）"
        required: true
        default: "1.0.16"
      dockerhub_username:
        description: "Docker Hub 用户名（默认 poillysky）"
        required: false
        default: "poillysky"
      dockerhub_token:
        description: "Docker Hub Access Token（Secrets 读不到时可临时粘贴到这里）"
        required: false
        default: ""

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: poillysky/telegramdl

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker Hub token
        env:
          # 优先 Secrets / Variables，其次手动 Run workflow 输入
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD || vars.DOCKERHUB_TOKEN || vars.DOCKERHUB_PASSWORD || inputs.dockerhub_token }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Token 为空。请用 Run workflow，在表单 dockerhub_token 栏粘贴 Access Token 后运行。"
            echo "Token 创建：https://hub.docker.com/settings/security"
            exit 1
          fi
          echo "Token OK (length=${#TOKEN})"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub_username || secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || 'poillysky' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD || vars.DOCKERHUB_TOKEN || vars.DOCKERHUB_PASSWORD || inputs.dockerhub_token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
